{% extends 'base.html' %}
{% block content %}
<div class="py-2">
    <!-- Encabezado con logo o icono simple -->
    <div class="mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-gradient text-white rounded-circle fs-3 fw-bold mb-3" style="width: 50px; height: 50px;">
            ♞
        </div>
        <h2 class="fw-bold text-dark m-0">Iniciar Sesión</h2>
        <p class="text-muted small">Ingresa tus credenciales para acceder</p>
    </div>

    <!-- Formulario limpio en fondo claro -->
    <form method="POST">
        <div class="mb-3">
            <label class="form-label fw-semibold text-secondary small">Correo Electrónico</label>
            <input type="email" name="email" class="form-control form-control-lg border-0 bg-light fs-6" placeholder="nombre@ejemplo.com" required>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold text-secondary small">Contraseña</label>
            <input type="password" name="password" class="form-control form-control-lg border-0 bg-light fs-6" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm" style="border-radius: 12px; background-color: #3b82f6; border: none;">
            Ingresar
        </button>
    </form>

    <div class="mt-4 text-center">
        <span class="text-muted small">¿No tienes cuenta?</span>
        <a href="{{ url_for('registro') }}" class="text-primary fw-semibold small text-decoration-none ms-1">Regístrate gratis</a>
    </div>
</div>
{% endblock %}
